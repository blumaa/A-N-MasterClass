# Pipeline = package.json `verify`. Gates listed there only (one list, no drift).
# database: fresh local stack from migrations, then pgTAP suites (G10, G21).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Keep in sync with scripts/verify-ci.sh (local copy of this job). DATA_SOURCE is required.
    env:
      PLATFORM_HOST: localhost
      DATA_SOURCE: fake
    steps:
      - uses: actions/checkout@v7

      # Before setup-node: `cache: 'pnpm'` needs pnpm on PATH. Version from packageManager.
      - uses: pnpm/action-setup@v6

      # node-version-file only: `node-version` would silently override .tool-versions.
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.tool-versions'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.tool-versions'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      # Full stack: policies need auth schema. pnpm exec = lockfile-pinned CLI.
      - run: pnpm exec supabase start
      # Replay every migration into an empty DB.
      - run: pnpm exec supabase db reset

      - name: pgTAP suites
        run: |
          eval "$(pnpm exec supabase status -o env --override-name db.url=SUPABASE_DB_URL)"
          export SUPABASE_DB_URL
          pnpm test:sql
